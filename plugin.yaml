id: pihole
name: Pi-hole
version: 0.1.0
protocol: 1
entrypoint: main.py
timeout_s: 60
description: >-
  Pi-hole v6 DNS servers through their REST API: the server and its version,
  its local DNS names (Local DNS records) and domain, and its DHCP server's
  leases, fixed addresses and pool usage when it is on. Omini creates, changes
  and removes local DNS names on it.
author: Omini
homepage: https://github.com/riccardoalv/omini-plugin-pihole
changes:
  - dns.set
  - dns.delete
backup: true
fields:
  - key: url
    type: url
    label: Address
    required: true
    help: Pi-hole's web interface, e.g. http://192.168.1.53 or https://pi.hole (without /admin)
  - key: password
    type: secret
    label: Application password
    required: true
    help: >-
      An application password (Settings → Web interface / API → Expert →
      Configure app password). To change DNS names from Omini, turn on
      webserver.api.app_sudo too (see the plugin's README).
  - key: verify_tls
    type: bool
    label: Verify the TLS certificate
    default: false
    group: Advanced
    help: Pi-hole uses a self-signed certificate by default; turn this on if yours is trusted.
